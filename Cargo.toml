[package]
name = "valheim-backup-cheat-scanner"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
# `.db2` world metadata is a gzip stream. Pure-Rust backend so the native CLI and the WASM module
# share one parser instead of shelling out to `gzip` or reimplementing inflate.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The browser's scrub hands back a `.tar.zst` like the host's backup: one frame with an XXH64
# content checksum. Pure Rust so it compiles into the same WASM module.
ruzstd = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.92"
