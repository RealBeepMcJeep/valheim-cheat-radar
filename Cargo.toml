[package]
name = "valheim-backup-cheat-scanner"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
# `.db2` world metadata is a gzip stream. Pure-Rust backend so the native CLI and the WASM module
# share one parser instead of shelling out to `gzip` or reimplementing inflate.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The browser scrub compresses with the reference zstd library (web/, @hpcc-js/wasm-zstd), which
# does not expose zstd's content-checksum switch; the XXH64 checksum a host's backup carries is
# added here instead. Pure Rust so it compiles into the same WASM module.
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.92"
