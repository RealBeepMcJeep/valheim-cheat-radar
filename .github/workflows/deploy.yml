name: Build and publish

# Pushes to main build and deploy the Pages site. Publishing a release
# builds that tag and attaches the single-file HTML to the release.
# workflow_dispatch can do either: leave `tag` empty to (re)deploy the
# site, or set it to (re)attach a release asset.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the single-file build to
        required: false
        default: ''

permissions:
  contents: write # attach the single-file build to a release
  pages: write
  id-token: write

concurrency:
  # Release builds and site deploys must not cancel each other: a docs push
  # should not kill an asset upload, and a tag build should not kill a deploy.
  # Keyed by tag, so two different releases stay independent too.
  group: ${{ inputs.tag || github.event.release.tag_name || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build that tag itself, not whatever main has become since.
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run wasm:build
        working-directory: web
      - run: npm run build
        working-directory: web

      # Keeps single-file inlining honest against Vite output changes.
      - run: node scripts/build-single-file.mjs
        working-directory: web

      - name: Attach the single-file build to the release
        if: github.event_name == 'release' || inputs.tag != ''
        working-directory: web
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          ASSET: dist-single/valheim-cheat-radar.html
        run: gh release upload "$TAG" "$ASSET" --clobber

      # Serve the asset directory verbatim.
      - run: touch dist/.nojekyll
        working-directory: web
        if: github.event_name != 'release' && inputs.tag == ''

      - uses: actions/configure-pages@v5
        if: github.event_name != 'release' && inputs.tag == ''
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'release' && inputs.tag == ''
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name != 'release' && inputs.tag == ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
